<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="40" height="40">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="40" height="40" rx="7" fill="url(#g)"/>
  <!-- QR finder pattern: top-left -->
  <rect x="4" y="4" width="9" height="9" rx="1.5" fill="white"/>
  <rect x="6" y="6" width="5" height="5" rx="0.8" fill="url(#g)"/>
  <!-- QR finder pattern: top-right -->
  <rect x="19" y="4" width="9" height="9" rx="1.5" fill="white"/>
  <rect x="21" y="6" width="5" height="5" rx="0.8" fill="url(#g)"/>
  <!-- QR finder pattern: bottom-left -->
  <rect x="4" y="19" width="9" height="9" rx="1.5" fill="white"/>
  <rect x="6" y="21" width="5" height="5" rx="0.8" fill="url(#g)"/>
